version: "3.9"

services:
    # Laravel(PHP)
    php:
        build:
            context: ./docker/php
        volumes:
            - ./backend:/var/www/html
        depends_on:
            - mysql

    # MySQL
    mysql:
        image: mysql:8.0
        user: "1000:1000"
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_USER: laravel
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db-data:/var/lib/mysql
        ports:
            - "3306:3306"

    # React(Node)
    node:
        build:
            context: ./docker/node
        volumes:
            - ./frontend:/app
        ports:
            - "3000:3000"
        command: sh -c "npm install && npm start"

    # Nginx
    nginx:
        build:
            context: ./docker/nginx
        ports:
            - "80:80"
        volumes:
            - ./backend:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
            - node

volumes:
    db-data:
